training:
  id: ATS011
  title: "KCA: Writing Policies"
  description: >
    Training material covering the Kyverno Certified Associate (KCA)
    Writing Policies domain, with hands-on labs for each competency.

  certification:
    name: Kyverno Certified Associate
    code: KCA
    provider: CNCF / Linux Foundation
    domain: Writing Policies
    weight: 32

modules:
  - id: module-000
    title: "Section 000: Policy Objects and Rule Anatomy (Primer)"
    description: >
      Primer, not one of the eleven Writing Policies competencies. Covers the
      policy object itself: ClusterPolicy versus namespaced Policy, the fields
      every rule shares, validationFailureAction and per-rule failureAction,
      validationFailureActionOverrides for per-namespace rollout, the fixed
      order Kyverno runs rule types in, and choosing between exclude,
      preconditions and a PolicyException.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-000/README.md

      - type: reading
        title: "Module 1: Policy Objects and Rule Anatomy"
        path: sections/section-000/module-01/course.md


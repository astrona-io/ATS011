# Knowledge check for section 090. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats011-090
course_id: ATS011
exam_code: KCA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-090
  title: "Autogen Rules"
questions:

  - id: ats011-090-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Predict autogen for a Pod-only rule"
    source_readings:
      - sections/section-090/module-01/course-01-what-autogen-generates.md
    prompt: "You write a `ClusterPolicy` rule whose `match` selects only `kind: Pod`, apply it with no special annotations, and submit a non-compliant `Deployment`. What happens?"
    options:
      - id: a
        text: "It is admitted, because the rule matches only Pods."
        explanation: "Autogen retargets the rule to controller kinds."
      - id: b
        text: "It is admitted with a warning, because controllers are advisory."
        explanation: "Controllers are enforced like Pods."
      - id: c
        text: "It is rejected only if you also write `kind: Deployment` in `match`."
        explanation: "You never need to write that kind."
      - id: d
        text: "It is rejected, because autogen clones the rule for `DaemonSet`, `Deployment`, `Job`, `ReplicaSet`, `ReplicationController`, `StatefulSet`, and, through a separate rule, `CronJob`."
        explanation: "Correct. The Deployment's Pod template is checked by the generated rule."
    correct_option: d
    explanation: "The Deployment's Pod template is checked by the generated rule."

  - id: ats011-090-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find autogenerated rules on a current release"
    source_readings:
      - sections/section-090/module-01/course-01-what-autogen-generates.md
    prompt: "After applying a Pod-only `ClusterPolicy` you look under `spec.rules` for the autogenerated rule and do not find it. Where should you look?"
    options:
      - id: a
        text: "Under `status.autogen.rules`, since current releases keep `spec.rules` exactly as authored, while older versions spliced rules into `spec.rules`."
        explanation: "Correct. Re-verify such details against the version you run."
      - id: b
        text: "Under `metadata.annotations`, which stores the generated YAML."
        explanation: "Annotations do not hold the rules."
      - id: c
        text: "In a separate `ClusterPolicy` named after the original with a suffix."
        explanation: "No separate policy is created."
      - id: d
        text: "Nowhere, because the rule is computed during each admission request and never stored."
        explanation: "It is reported in status."
    correct_option: a
    explanation: "Re-verify such details against the version you run."

  - id: ats011-090-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare generated paths for Deployments and CronJobs"
    source_readings:
      - sections/section-090/module-01/course-01-what-autogen-generates.md
    prompt: "A Pod-only rule checks `metadata.labels.team`. What does the generated rule check on a Deployment and on a CronJob, and why do they differ?"
    options:
      - id: a
        text: "Both check `spec.template.metadata.labels.team`, since all controllers share one layout."
        explanation: "CronJob nests deeper."
      - id: b
        text: "Both check `spec.jobTemplate.metadata.labels.team`."
        explanation: "Only CronJob uses `jobTemplate`."
      - id: c
        text: "The Deployment checks `spec.template.metadata.labels.team`, and the CronJob checks `spec.jobTemplate.spec.template.metadata.labels.team`, because its Pod template sits inside a nested Job spec."
        explanation: "Correct. That is why CronJob gets its own generated rule."
      - id: d
        text: "The Deployment path is unchanged, and only the CronJob path is rewritten."
        explanation: "Both are rewritten."
    correct_option: c
    explanation: "That is why CronJob gets its own generated rule."

  - id: ats011-090-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Restrict or disable autogen with the annotation"
    source_readings:
      - sections/section-090/module-01/course-02-controlling-autogen-scope.md
    prompt: "What mechanism restricts which controller kinds get an autogenerated rule, and what value disables autogen entirely?"
    options:
      - id: a
        text: "A `spec.autogen` field, and `false` disables it."
        explanation: "It is an annotation."
      - id: b
        text: "The `match.kinds` list, and an empty list disables it."
        explanation: "That list does not control autogen."
      - id: c
        text: "The `pod-policies.kyverno.io/autogen-controllers` annotation with a comma-separated kind list, and `none` disables it so `status.autogen` is empty."
        explanation: "Correct. Only the literal rule you wrote is then evaluated."
      - id: d
        text: "A cluster-wide Kyverno flag, and unsetting it disables autogen."
        explanation: "The control is per policy."
    correct_option: c
    explanation: "Only the literal rule you wrote is then evaluated."

  - id: ats011-090-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict how a Job behaves when its autogen is excluded"
    source_readings:
      - sections/section-090/module-01/course-02-controlling-autogen-scope.md
    prompt: "Autogen is scoped to `Deployment` only, and you submit a non-compliant `Job` with no `team` label on its template. Is the Job admitted, and does it run a Pod?"
    options:
      - id: a
        text: "The Job is rejected, so no Pod is ever created."
        explanation: "No rule was generated for Job."
      - id: b
        text: "The Job is admitted and its Pod runs, because the original rule is disabled."
        explanation: "The original Pod rule still applies."
      - id: c
        text: "The Job is admitted, but its Pod is a bare Pod submission that the original rule rejects, so the Job fails repeatedly with `FailedCreate`."
        explanation: "Correct. Scoping autogen never narrows what the original Pod rule matches."
      - id: d
        text: "The Job is admitted and its Pod runs once before being deleted."
        explanation: "The Pod is rejected at creation."
    correct_option: c
    explanation: "Scoping autogen never narrows what the original Pod rule matches."

  - id: ats011-090-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict autogen for a rule that names other kinds"
    source_readings:
      - sections/section-090/module-01/course-03-when-autogen-declines.md
    prompt: "A rule's `match.any` lists both `Pod` and `Namespace` as `kinds` in the same entry. What does autogen do?"
    options:
      - id: a
        text: "It generates the Pod controller rules and ignores Namespace."
        explanation: "It does not partially generate."
      - id: b
        text: "It generates rules for every kind in the list."
        explanation: "Namespace has no Pod template."
      - id: c
        text: "It rejects the policy as invalid."
        explanation: "The policy is accepted."
      - id: d
        text: "Nothing, because naming any kind other than `Pod` makes autogen skip the rule, so write two single-kind rules instead."
        explanation: "Correct. `status.autogen` comes back empty."
    correct_option: d
    explanation: "`status.autogen` comes back empty."

  - id: ats011-090-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Spot a pattern that already contains spec.template"
    source_readings:
      - sections/section-090/module-01/course-03-when-autogen-declines.md
    prompt: "A Pod-only rule's `pattern` already nests fields under `spec.template`. Autogen still fires. What does the generated path look like, and is it usable?"
    options:
      - id: a
        text: "Autogen detects the existing nesting and leaves the path alone, so it works."
        explanation: "Autogen does not interpret the pattern."
      - id: b
        text: "Autogen removes `template` first, then rewrites it, so it works."
        explanation: "It performs a fixed rewrite only."
      - id: c
        text: "It wraps the content again, producing `spec.template.spec.template.spec.containers`, which never exists, so the rule is silently useless."
        explanation: "Correct. Write the rule in the Pod's native shape and let autogen produce the controller path."
      - id: d
        text: "It fails with an error at apply time."
        explanation: "It is generated without any error."
    correct_option: c
    explanation: "Write the rule in the Pod's native shape and let autogen produce the controller path."

  - id: ats011-090-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Treat the autogen annotation as a real control"
    source_readings:
      - sections/section-090/module-01/course-02-controlling-autogen-scope.md
    prompt: "True or false: because `pod-policies.kyverno.io/autogen-controllers` is metadata rather than a `spec` field, it has no effect on enforcement."
    options:
      - id: a
        text: "True, because annotations are informational only."
        explanation: "This one is acted on."
      - id: b
        text: "True, but only for cluster-scoped policies."
        explanation: "Scope does not matter."
      - id: c
        text: "False, but only when set to `none`."
        explanation: "Any kind list changes the output."
      - id: d
        text: "False, because it decides the contents of `status.autogen.rules`, and it is the current documented mechanism rather than a legacy one."
        explanation: "Correct. Kyverno's policy controller reads it like a `spec` field."
    correct_option: d
    explanation: "Kyverno's policy controller reads it like a `spec` field."

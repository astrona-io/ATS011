# The CEL-Native Policy Family (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: kind cluster by default (no `runtime:` block). For a clean VM over
# SSH with no Kubernetes, add a `runtime:` block with type "qemu" — see
# references/astrona-cli.md in the skill. `scripts/scaffold_playground.sh
# --runtime qemu` appends a starter block for you.

metadata:
  name: "ats-011-playground-1102"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "OS prep only: install tools/packages, seed sample data. Nothing to solve."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

# Final domain quiz for the KCA Writing Policies domain. Closed-book simulator; listed in astrona.yaml as the final quiz.
schema_version: 1
kind: question_bank
id: ats011-final
course_id: ATS011
exam_code: KCA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: writing-policies
  title: "Writing Policies"
questions:

  - id: ats011-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Predict how the ?* wildcard treats empty and absent values"
    source_readings:
      - sections/section-010/module-01/course-01-the-clusterpolicy-object.md
      - sections/section-010/module-01/course-02-the-pattern-block-and-failure-actions.md
      - sections/section-000/module-01/course-01-policy-objects-and-rule-anatomy.md
      - sections/section-000/module-01/course-02-failure-actions-and-rollout.md
      - sections/section-000/module-01/course-03-rule-ordering-and-exceptions.md
    prompt: "A `validate.pattern` requires `metadata.labels.team: \"?*\"`. One Pod is submitted with `labels: {team: \"\"}` and another with no `labels` key at all. What happens?"
    options:
      - id: a
        text: "Both are rejected: `?*` needs at least one character, and an absent `labels` map cannot satisfy the path."
        explanation: "`?*` means one character followed by anything, so an empty string fails; a missing parent map also fails the pattern path. Plain `*` would be the weaker check an empty string can satisfy."
      - id: b
        text: "Only the empty-string Pod is rejected; the Pod without `labels` is skipped because there is nothing to check."
        explanation: "An absent parent does not make the rule skip; the pattern path is unsatisfied and the resource fails."
      - id: c
        text: "Both are admitted, because `?*` matches any value including an empty one."
        explanation: "`?` requires exactly one character, so an empty value cannot match."
      - id: d
        text: "Only the Pod without `labels` is rejected; an empty string counts as present."
        explanation: "An empty string fails `?*` because there is no first character."
    correct_option: a
    explanation: "`?*` means one character followed by anything, so an empty string fails; a missing parent map also fails the pattern path. Plain `*` would be the weaker check an empty string can satisfy."

  - id: ats011-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Split a rule between match and preconditions"
    source_readings:
      - sections/section-020/module-01/course-01-preconditions-and-operators.md
      - sections/section-020/module-01/course-02-preconditions-vs-match.md
    prompt: "A rule must apply only when the request is an UPDATE and the resource already carries the label `env=prod`. How should the conditions be divided?"
    options:
      - id: a
        text: "Put both in `match`, because `match` can evaluate any JMESPath expression."
        explanation: "`match` selects by identity; it does not evaluate arbitrary JMESPath over the request."
      - id: b
        text: "Put the operation test in a label selector and the label in `preconditions`."
        explanation: "Operations are not labels; that division reverses what each block is for."
      - id: c
        text: "Put the label selector in `match` and the operation test in `preconditions` as `{{ request.operation }}` Equals UPDATE."
        explanation: "`match` selects on resource identity such as kind, name, namespace and labels, while `preconditions` evaluates JMESPath over the request and the resource's field values."
      - id: d
        text: "Put both in `preconditions`, because `match` cannot see labels at all."
        explanation: "`match` can select on labels, and doing so is the idiomatic, cheaper place for it."
    correct_option: c
    explanation: "`match` selects on resource identity such as kind, name, namespace and labels, while `preconditions` evaluates JMESPath over the request and the resource's field values."

  - id: ats011-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain request-only context in a background scan"
    source_readings:
      - sections/section-030/module-01/course-01-what-background-scans-do.md
      - sections/section-030/module-01/course-02-request-context-and-limits.md
    prompt: "A policy has `background: true` and a rule whose preconditions read `{{ request.userInfo.username }}`. What is the consequence during a background scan?"
    options:
      - id: a
        text: "Kyverno substitutes the username of the policy's creator."
        explanation: "Kyverno never invents a user for a scan."
      - id: b
        text: "There is no admission request during a scan, so the variable cannot resolve and the rule is skipped or errors rather than being evaluated."
        explanation: "Request-only context such as `request.userInfo`, `request.operation` and `request.roles` exists only at admission time; background scans have no requester to read."
      - id: c
        text: "The scan evaluates the rule normally because stored resources record who created them."
        explanation: "Stored resources do not carry the request's user info as request context."
      - id: d
        text: "The `background` setting overrides the precondition, which is ignored."
        explanation: "Preconditions are not ignored; the rule simply cannot be meaningfully evaluated."
    correct_option: b
    explanation: "Request-only context such as `request.userInfo`, `request.operation` and `request.roles` exists only at admission time; background scans have no requester to read."

  - id: ats011-final-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Contrast Audit and Enforce and locate the Audit result"
    source_readings:
      - sections/section-010/module-01/course-01-the-clusterpolicy-object.md
      - sections/section-010/module-01/course-02-the-pattern-block-and-failure-actions.md
      - sections/section-030/module-01/course-01-what-background-scans-do.md
      - sections/section-030/module-01/course-02-request-context-and-limits.md
      - sections/section-000/module-01/course-01-policy-objects-and-rule-anatomy.md
      - sections/section-000/module-01/course-02-failure-actions-and-rollout.md
      - sections/section-000/module-01/course-03-rule-ordering-and-exceptions.md
    prompt: "What is the observable difference between `validationFailureAction: Audit` and `Enforce`, and where is the result of Audit read?"
    options:
      - id: a
        text: "Audit rejects the request silently; Enforce rejects it with a message."
        explanation: "Audit never rejects."
      - id: b
        text: "Audit deletes the offending resource later; Enforce only logs it."
        explanation: "Neither mode deletes resources after admission."
      - id: c
        text: "Audit writes the result to the Pod's events; Enforce writes it to a PolicyReport."
        explanation: "Both reports and events are not swapped this way; reports belong to Audit findings."
      - id: d
        text: "Enforce rejects the request; Audit admits it and records the violation in a PolicyReport or ClusterPolicyReport."
        explanation: "Audit is the safe posture for rolling out a policy on a live cluster, and its findings are read with `kubectl get policyreport -A`. Enforce is what actually prevents creation."
    correct_option: d
    explanation: "Audit is the safe posture for rolling out a policy on a live cluster, and its findings are read with `kubectl get policyreport -A`. Enforce is what actually prevents creation."

  - id: ats011-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an unnamed list entry in patchStrategicMerge"
    source_readings:
      - sections/section-040/module-01/course-01-patchstrategicmerge-mechanics.md
      - sections/section-040/module-01/course-02-mutating-existing-resources.md
    prompt: "A `patchStrategicMerge` fragment lists `containers: [{imagePullPolicy: IfNotPresent}]` with no `name`. It is applied to a Pod with two containers. What happens?"
    options:
      - id: a
        text: "Both containers receive the setting, because a missing name acts as a wildcard."
        explanation: "Only the `(name)` anchor gives wildcard behaviour."
      - id: b
        text: "The Pod is rejected: the entry matches no container by merge key and is inserted as a nameless container."
        explanation: "Strategic merge reconciles containers by `name`; a missing name is not a silent no-op. Use the `(name): \"*\"` anchor to mean every container."
      - id: c
        text: "Only the first container is patched, because lists merge by position."
        explanation: "Containers merge by the `name` key, not by index."
      - id: d
        text: "The fragment is silently ignored and the Pod is admitted unchanged."
        explanation: "It is inserted as a new element rather than ignored."
    correct_option: b
    explanation: "Strategic merge reconciles containers by `name`; a missing name is not a silent no-op. Use the `(name): \"*\"` anchor to mean every container."

  - id: ats011-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Escape a slash in a JSON Pointer"
    source_readings:
      - sections/section-080/module-01/course-01-json-patch-operations.md
      - sections/section-080/module-01/course-02-pointer-escaping-and-missing-paths.md
      - sections/section-080/module-01/course-03-guarded-removal-and-safe-patches.md
    prompt: "Which JSON Pointer targets the annotation `policy.example.com/reviewed`?"
    options:
      - id: a
        text: "`/metadata/annotations/policy.example.com~1reviewed`"
        explanation: "RFC 6901 treats a literal `/` as a path separator, so the slash in the key is written `~1`, and `~` is written `~0`. Dots and dashes need no escaping."
      - id: b
        text: "`/metadata/annotations/policy.example.com/reviewed`"
        explanation: "The raw slash splits the key into extra path segments."
      - id: c
        text: "`/metadata/annotations/policy.example.com~0reviewed`"
        explanation: "`~0` escapes a tilde, not a slash."
      - id: d
        text: "`/metadata/annotations/policy~1example~1com~1reviewed`"
        explanation: "Dots do not need escaping; only the slash does."
    correct_option: a
    explanation: "RFC 6901 treats a literal `/` as a path separator, so the slash in the key is written `~1`, and `~` is written `~0`. Dots and dashes need no escaping."

  - id: ats011-final-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Compare add, remove and replace on a missing path"
    source_readings:
      - sections/section-080/module-01/course-01-json-patch-operations.md
      - sections/section-080/module-01/course-02-pointer-escaping-and-missing-paths.md
      - sections/section-080/module-01/course-03-guarded-removal-and-safe-patches.md
    prompt: "On Kyverno v1.19.1, three JSON Patch rules target a path that does not exist: one `add`, one `remove`, one `replace`. What is the outcome?"
    options:
      - id: a
        text: "All three succeed, creating the path if it is missing."
        explanation: "Only `add` creates the path."
      - id: b
        text: "`add` and `replace` succeed; `remove` rejects the request."
        explanation: "`replace` is the one that rejects and `remove` is a no-op."
      - id: c
        text: "All three are silent no-ops because the path does not exist."
        explanation: "`add` creates it and `replace` fails the request."
      - id: d
        text: "`add` creates the path, `remove` is a silent no-op, and `replace` rejects the whole request."
        explanation: "The safe design rule is that an unconditional `add` needs no guard, while `remove` and `replace` should be gated by a precondition that the field exists."
    correct_option: d
    explanation: "The safe design rule is that an unconditional `add` needs no guard, while `remove` and `replace` should be gated by a precondition that the field exists."

  - id: ats011-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "State what mutateExistingOnPolicyUpdate adds"
    source_readings:
      - sections/section-040/module-01/course-01-patchstrategicmerge-mechanics.md
      - sections/section-040/module-01/course-02-mutating-existing-resources.md
    prompt: "What does `mutateExistingOnPolicyUpdate: true` with a `targets` block do that an ordinary mutate rule cannot?"
    options:
      - id: a
        text: "It makes the API server re-admit every resource through the webhook once."
        explanation: "The patching is done by the background controller, not by re-admission."
      - id: b
        text: "It lets a mutate rule run after validate rules."
        explanation: "It does not change rule-type ordering."
      - id: c
        text: "It makes the background controller patch resources that already existed before the policy was applied."
        explanation: "An ordinary mutate rule only sees resources passing through admission. Patching existing targets also requires the background controller to hold RBAC to update the target kind."
      - id: d
        text: "It allows mutate rules to run without any RBAC."
        explanation: "Updating targets needs explicit RBAC for the background controller."
    correct_option: c
    explanation: "An ordinary mutate rule only sees resources passing through admission. Patching existing targets also requires the background controller to hold RBAC to update the target kind."

  - id: ats011-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict synchronize behaviour on edits and deletes"
    source_readings:
      - sections/section-050/module-01/course-01-generate-rule-anatomy-and-data.md
      - sections/section-050/module-01/course-02-clone-and-synchronize.md
    prompt: "A generate rule with `synchronize: true` creates a ConfigMap in each new Namespace. An operator edits one generated ConfigMap by hand, then deletes another. What happens?"
    options:
      - id: a
        text: "The edit persists and the deletion is permanent."
        explanation: "That is the `synchronize: false` behaviour."
      - id: b
        text: "The edit is reverted but the deleted ConfigMap stays deleted."
        explanation: "Deletion is also self-healed."
      - id: c
        text: "The edit is reverted and the deleted ConfigMap is recreated."
        explanation: "With synchronize, generated resources are continuously reconciled against their source. With `synchronize: false` the resource is created once and left alone."
      - id: d
        text: "Both are blocked by the admission webhook."
        explanation: "Kyverno reconciles after the fact rather than blocking."
    correct_option: c
    explanation: "With synchronize, generated resources are continuously reconciled against their source. With `synchronize: false` the resource is created once and left alone."

  - id: ats011-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain digest pinning with mutateDigest"
    source_readings:
      - sections/section-060/module-01/course-01-signature-verification-and-attestors.md
      - sections/section-060/module-01/course-02-attestations-and-digest-pinning.md
    prompt: "A `verifyImages` rule has `mutateDigest: true`. A Pod references `registry.example.com/app:v1.2`. What is persisted, and why does it matter?"
    options:
      - id: a
        text: "The reference is left as is; the digest is only recorded in a report."
        explanation: "`mutateDigest` rewrites the spec."
      - id: b
        text: "The image is replaced with a copy stored in the cluster."
        explanation: "Kyverno does not copy images; it rewrites the reference."
      - id: c
        text: "The tag is dropped and the digest check happens only at pull time."
        explanation: "The digest is pinned at admission."
      - id: d
        text: "The tag gains the resolved digest, so the kubelet pulls exactly the bytes that were verified."
        explanation: "A tag is a mutable pointer; pinning the digest closes the window in which a republished tag could swap the image after verification."
    correct_option: d
    explanation: "A tag is a mutable pointer; pinning the digest closes the window in which a republished tag could swap the image after verification."

  - id: ats011-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the mechanism for live cluster data"
    source_readings:
      - sections/section-070/module-01/course-01-jmespath-variables-and-context.md
      - sections/section-070/module-01/course-02-apicall-and-live-cluster-data.md
    prompt: "A rule must decide based on how many Pods already exist in the requesting namespace. Which mechanism supplies that, and what is unusual about it?"
    options:
      - id: a
        text: "A `context.apiCall`, whose value is fetched from live cluster state at evaluation time and needs read permission."
        explanation: "Because the value is not stored in the policy, the same unchanged policy can reach different verdicts on different days."
      - id: b
        text: "A `ConfigMap` context, whose value is baked into the policy when applied."
        explanation: "A ConfigMap is a stored lookup, not a live API query."
      - id: c
        text: "The `images` variable, which counts Pods in the request."
        explanation: "`images` describes container images in the request."
      - id: d
        text: "The `request.object` variable, which holds the namespace Pod list."
        explanation: "`request.object` is the incoming resource only."
    correct_option: a
    explanation: "Because the value is not stored in the policy, the same unchanged policy can reach different verdicts on different days."

  - id: ats011-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain quoting and the empty fallback in JMESPath"
    source_readings:
      - sections/section-070/module-01/course-01-jmespath-variables-and-context.md
      - sections/section-070/module-01/course-02-apicall-and-live-cluster-data.md
      - sections/section-080/module-01/course-01-json-patch-operations.md
      - sections/section-080/module-01/course-02-pointer-escaping-and-missing-paths.md
      - sections/section-080/module-01/course-03-guarded-removal-and-safe-patches.md
    prompt: "Why is `{{ request.object.metadata.annotations.\"example.com/owner\" || '' }}` written with both double quotes and `|| ''`?"
    options:
      - id: a
        text: "The quotes escape the dot and `|| ''` makes the value optional in the schema."
        explanation: "Quotes handle the slash, and the fallback is runtime behaviour, not schema."
      - id: b
        text: "The quotes protect the slash in the key, and `|| ''` avoids a substitution error when annotations are missing."
        explanation: "A bare unresolved variable is an error, not an empty value; comparing the fallback against an empty string with NotEquals is the standard key-exists idiom."
      - id: c
        text: "Both are decorative; Kyverno resolves the expression identically without them."
        explanation: "Without them the slash is syntax and the missing map errors."
      - id: d
        text: "The quotes mark a string literal and `|| ''` joins two annotations."
        explanation: "`||` is an or-fallback, not concatenation."
    correct_option: b
    explanation: "A bare unresolved variable is an error, not an empty value; comparing the fallback against an empty string with NotEquals is the standard key-exists idiom."

  - id: ats011-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict autogen when match names a non-Pod kind"
    source_readings:
      - sections/section-090/module-01/course-01-what-autogen-generates.md
      - sections/section-090/module-01/course-02-controlling-autogen-scope.md
      - sections/section-090/module-01/course-03-when-autogen-declines.md
    prompt: "A rule's `match.any` lists `kinds: [Pod, Namespace]` in a single entry. How many autogenerated rules does Kyverno produce?"
    options:
      - id: a
        text: "One, covering Deployments only."
        explanation: "No controller rules are produced at all."
      - id: b
        text: "Seven, one per controller kind, ignoring Namespace."
        explanation: "Autogen does not ignore the extra kind; it declines."
      - id: c
        text: "Two: one for Pod and one for Namespace."
        explanation: "Autogen does not split a mixed entry."
      - id: d
        text: "None: autogen declines when any match or exclude entry names a kind other than Pod."
        explanation: "Kyverno will not produce a partial rewrite; two single-kind rules are needed for a Pod check and a Namespace check."
    correct_option: d
    explanation: "Kyverno will not produce a partial rewrite; two single-kind rules are needed for a Pod check and a Namespace check."

  - id: ats011-final-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare autogen path rewrites"
    source_readings:
      - sections/section-090/module-01/course-01-what-autogen-generates.md
      - sections/section-090/module-01/course-02-controlling-autogen-scope.md
      - sections/section-090/module-01/course-03-when-autogen-declines.md
    prompt: "A Pod-only rule checks `metadata.labels.team`. What are the rewritten paths for a Deployment and for a CronJob?"
    options:
      - id: a
        text: "Both use `spec.template.metadata.labels.team`."
        explanation: "A CronJob nests its Pod template under a Job template."
      - id: b
        text: "Deployment: `spec.template.metadata.labels.team`; CronJob: `spec.jobTemplate.spec.template.metadata.labels.team`."
        explanation: "Six controller kinds share the `spec.template` shape and one generated rule; a CronJob nests its template deeper and gets its own rule."
      - id: c
        text: "Both use `spec.jobTemplate.spec.template.metadata.labels.team`."
        explanation: "Only CronJob uses that path."
      - id: d
        text: "Deployment keeps `metadata.labels.team`; CronJob uses `spec.metadata.labels.team`."
        explanation: "The Pod template is always nested under a template key."
    correct_option: b
    explanation: "Six controller kinds share the `spec.template` shape and one generated rule; a CronJob nests its template deeper and gets its own rule."

  - id: ats011-final-q15
    type: single_choice
    difficulty: advanced
    learning_objective: "Trace what happens to a Job when autogen is scoped away"
    source_readings:
      - sections/section-090/module-01/course-01-what-autogen-generates.md
      - sections/section-090/module-01/course-02-controlling-autogen-scope.md
      - sections/section-090/module-01/course-03-when-autogen-declines.md
    prompt: "Autogen is scoped to Deployment with the `pod-policies.kyverno.io/autogen-controllers` annotation, excluding Job. A non-compliant Job is submitted. What happens?"
    options:
      - id: a
        text: "The Job is rejected at submission by the Pod rule."
        explanation: "No rule was generated for Job, so the Job object itself is admitted."
      - id: b
        text: "The Job and its Pods are both admitted, since the Pod rule only applies to bare Pods."
        explanation: "The Job controller's Pods are Pod submissions and are checked."
      - id: c
        text: "The Job object is admitted, but its Pods are rejected by the original Pod rule, so the Job keeps failing."
        explanation: "Scoping narrows which controller objects get a generated rule; it never narrows what the original Pod rule matches, so FailedCreate events repeat."
      - id: d
        text: "The Job runs once and then the policy deletes it."
        explanation: "Validate rules do not delete resources."
    correct_option: c
    explanation: "Scoping narrows which controller objects get a generated rule; it never narrows what the original Pod rule matches, so FailedCreate events repeat."

  - id: ats011-final-q16
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a pre-nested pattern under autogen"
    source_readings:
      - sections/section-090/module-01/course-01-what-autogen-generates.md
      - sections/section-090/module-01/course-02-controlling-autogen-scope.md
      - sections/section-090/module-01/course-03-when-autogen-declines.md
    prompt: "A Pod-only rule already nests its pattern under `spec.template`, anticipating a Deployment. Autogen fires. What does the generated rule check?"
    options:
      - id: a
        text: "A path such as `spec.template.spec.template...` that exists on nothing, so the rule is silently useless."
        explanation: "Autogen applies a fixed mechanical rewrite and does not interpret the pattern; write the Pod rule in the Pod's native shape."
      - id: b
        text: "The correct Deployment path, since autogen detects existing nesting."
        explanation: "Autogen does not detect or skip existing nesting."
      - id: c
        text: "Nothing, because autogen declines when the pattern mentions `template`."
        explanation: "It still generates; the result is just wrong."
      - id: d
        text: "The same pattern as written, applied to every controller."
        explanation: "The pattern is wrapped one level deeper."
    correct_option: a
    explanation: "Autogen applies a fixed mechanical rewrite and does not interpret the pattern; write the Pod rule in the Pod's native shape."

  - id: ats011-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Identify whose RBAC a cleanup policy needs"
    source_readings:
      - sections/section-100/module-01/course-01-schedules-matching-and-rbac.md
      - sections/section-100/module-01/course-02-conditions-ttl-and-deletion-semantics.md
    prompt: "A well-formed ClusterCleanupPolicy for Pods is rejected with `cleanup controller has no permission to delete kind Pod`, even for a cluster-admin. What fixes it?"
    options:
      - id: a
        text: "Create a ClusterRole labelled `rbac.kyverno.io/aggregate-to-cleanup-controller: \"true\"` granting get, list, watch and delete on `pods`."
        explanation: "The cleanup controller's own ServiceAccount needs permission, not the author; the webhook checks this at apply time rather than letting the policy delete nothing."
      - id: b
        text: "Bind cluster-admin to the user who applies the policy."
        explanation: "The user already has it; the controller's identity is the one checked."
      - id: c
        text: "Grant only `delete` on `Pod` using the singular kind name."
        explanation: "All four verbs on the lowercase plural resource are needed."
      - id: d
        text: "Set `background: true` on the policy."
        explanation: "That field does not affect cleanup permissions."
    correct_option: a
    explanation: "The cleanup controller's own ServiceAccount needs permission, not the author; the webhook checks this at apply time rather than letting the policy delete nothing."

  - id: ats011-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict cleanup timing against a cron schedule"
    source_readings:
      - sections/section-100/module-01/course-01-schedules-matching-and-rbac.md
      - sections/section-100/module-01/course-02-conditions-ttl-and-deletion-semantics.md
    prompt: "A cleanup policy has `schedule: \"* * * * *\"`. A matching Pod is created at 15:26:40. When is it deleted?"
    options:
      - id: a
        text: "Exactly 60 seconds later, at 15:27:40."
        explanation: "The sweep runs on cron boundaries, not relative to creation."
      - id: b
        text: "Immediately, because the cleanup webhook watches creations."
        explanation: "Cleanup is a scheduled sweep."
      - id: c
        text: "At 15:26:50, because the controller polls every ten seconds."
        explanation: "Cron's finest granularity is one minute."
      - id: d
        text: "At the next cron boundary, 15:27:00, and no timing tighter than up to a minute late is possible."

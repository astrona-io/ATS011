      - id: b
        text: "`restricted`; exempt one control with `podSecurity.exclude` and a `controlName`, optionally narrowed by images."
        explanation: "`restricted` requires runAsNonRoot, no privilege escalation, dropped capabilities and a seccomp profile. Lowering the namespace to baseline trades one exemption for many."
      - id: c
        text: "`privileged`; exempt a control with a PolicyException."
        explanation: "Privileged imposes no requirements."
      - id: d
        text: "`baseline`; exempt a control by deleting the policy."
        explanation: "That removes all protection."
    correct_option: b
    explanation: "`restricted` requires runAsNonRoot, no privilege escalation, dropped capabilities and a seccomp profile. Lowering the namespace to baseline trades one exemption for many."

  - id: ats011-final-q39
    type: single_choice
    difficulty: advanced
    learning_objective: "Fix a non-idempotent mutate rule"
    source_readings:
      - sections/section-040/module-02/course-01-foreach-in-mutate.md
      - sections/section-040/module-02/course-02-idempotency-and-rule-interaction.md
    prompt: "A rule prefixes every container image with a mirror hostname. A Pod is created correctly, then someone adds an unrelated label. What is the image now and what are the fixes?"
    options:
      - id: a
        text: "It is unchanged, because Kyverno detects the prior mutation."
        explanation: "Kyverno does not track that."
      - id: b
        text: "The Pod is rejected because the image changed."
        explanation: "Rejection is not caused by the double prefix."
      - id: c
        text: "It becomes doubly prefixed; add a precondition inside the foreach entry that skips already-prefixed images and limit `match` to CREATE."
        explanation: "The UPDATE re-ran the transformation on an already transformed value; mutateExistingOnPolicyUpdate can also re-run rules unprompted."
      - id: d
        text: "The prefix is removed and re-added once."
        explanation: "Mutation is not self-correcting."
    correct_option: c
    explanation: "The UPDATE re-ran the transformation on an already transformed value; mutateExistingOnPolicyUpdate can also re-run rules unprompted."

  - id: ats011-final-q40
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict deletion of a generating policy"
    source_readings:
      - sections/section-050/module-02/course-01-generate-existing.md
      - sections/section-050/module-02/course-02-lifecycle-and-orphaning.md
    prompt: "A ClusterPolicy's generate rule created a default-deny NetworkPolicy in fifty namespaces. The policy is deleted. What happens and which field changes it?"
    options:
      - id: a
        text: "All fifty NetworkPolicies are deleted; `orphanDownstreamOnPolicyDelete: true` keeps them."
        explanation: "Generated resources carry no ownerReferences; Kyverno tracks them by labels and UpdateRequests, so the behaviour is a field."
      - id: b
        text: "They remain, because generated resources are independent."
        explanation: "Without the field they are deleted."
      - id: c
        text: "They are deleted by Kubernetes garbage collection through owner references."
        explanation: "No owner references exist."
      - id: d
        text: "They remain until the namespaces are deleted."
        explanation: "The policy deletion removes them."
    correct_option: a
    explanation: "Generated resources carry no ownerReferences; Kyverno tracks them by labels and UpdateRequests, so the behaviour is a field."

  - id: ats011-final-q41
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reason about cloneList selector and namespace fields"
    source_readings:
      - sections/section-050/module-03/course-01-clonelist.md
      - sections/section-050/module-03/course-02-generate-foreach.md
    prompt: "A rule uses `generate.cloneList` with `namespace: shared-config`, kinds `v1/ConfigMap` and `v1/Secret`, and no selector. What is true?"
    options:
      - id: a
        text: "Every ConfigMap and Secret in shared-config is cloned, because the selector is the opt-in filter."
        explanation: "Here `cloneList.namespace` is the source while `generate.namespace` is the destination, so an unfiltered source namespace becomes a broadcast channel."
      - id: b
        text: "Nothing is cloned until a selector is added."
        explanation: "Without a selector everything of those kinds is cloned."
      - id: c
        text: "Only objects named in the policy are cloned."
        explanation: "`cloneList` names a namespace and kinds, not objects."
      - id: d
        text: "Objects are cloned out of the new namespace into shared-config."
        explanation: "`cloneList.namespace` is the source."
    correct_option: a
    explanation: "Here `cloneList.namespace` is the source while `generate.namespace` is the destination, so an unfiltered source namespace becomes a broadcast channel."

  - id: ats011-final-q42
    type: single_choice
    difficulty: advanced
    learning_objective: "Read a generate foreach with per-element preconditions"
    source_readings:
      - sections/section-050/module-03/course-01-clonelist.md
      - sections/section-050/module-03/course-02-generate-foreach.md
    prompt: "A Namespace annotated `envs: \"dev,test,legacy\"` triggers a generate foreach over `split(@, ',')` with a precondition skipping `legacy`. Which ConfigMaps are made?"
    options:
      - id: a
        text: "Three, one for every element including legacy."
        explanation: "The precondition skips legacy."
      - id: b
        text: "None, because a precondition on one element fails the whole loop."
        explanation: "Each element is evaluated independently."
      - id: c
        text: "One ConfigMap containing the three names."
        explanation: "`foreach` creates one resource per element."
      - id: d
        text: "One per element except `legacy`, because preconditions run for each element and failing ones are skipped."
        explanation: "`element` is the current item; `synchronize` stays at the generate level beside `foreach`."
    correct_option: d
    explanation: "`element` is the current item; `synchronize` stays at the generate level beside `foreach`."

  - id: ats011-final-q43
    type: single_choice
    difficulty: intermediate
    learning_objective: "Distinguish the key from the name field in images"
    source_readings:
      - sections/section-060/module-03/course-01-the-images-variable.md
      - sections/section-060/module-03/course-02-image-extractors.md
    prompt: "A Pod container named `api` runs `ghcr.io/example/team/web:1.4`. How is its image read from the `images` variable?"
    options:
      - id: a
        text: "Under `images.containers.web`, keyed by the image name."
        explanation: "Entries are keyed by the container name."
      - id: b
        text: "Under `images.containers.api`, with `name` equal to `web`, because the key is the container name and the `name` field is the last path segment."
        explanation: "A digest-pinned image has an empty `tag`, so a latest-tag check does not trip on it."
      - id: c
        text: "Under `images.api.web`, keyed by registry."
        explanation: "Entries sit inside a group such as `containers`."
      - id: d
        text: "Only through `request.object.spec`, because `images` is unparsed."
        explanation: "Kyverno parses images into the variable."
    correct_option: b
    explanation: "A digest-pinned image has an empty `tag`, so a latest-tag check does not trip on it."

  - id: ats011-final-q44
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the tool for a custom resource image"
    source_readings:
      - sections/section-060/module-03/course-01-the-images-variable.md
      - sections/section-060/module-03/course-02-image-extractors.md
    prompt: "A rule must check an image stored at `/spec/source/registry/url` in a custom resource with a `docker://` prefix. What is needed?"
    options:
      - id: a
        text: "Nothing; the `images` variable covers every resource kind."
        explanation: "Only Pods and pod controllers are covered by default."
      - id: b
        text: "A `verifyImages` rule alone, which discovers images itself."
        explanation: "It needs to know where the images are."
      - id: c
        text: "An `imageExtractors` entry for that kind with the path and a `jmesPath` such as `trim_prefix(@, 'docker://')`."
        explanation: "Kyverno only knows images in Pods and pod controllers by default; a missing or wrong path returns nothing so the rule checks nothing."
      - id: d
        text: "An autogen annotation naming the custom kind."
        explanation: "Autogen concerns pod controllers."
    correct_option: c
    explanation: "Kyverno only knows images in Pods and pod controllers by default; a missing or wrong path returns nothing so the rule checks nothing."

  - id: ats011-final-q45
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply the rule-type ordering"
    source_readings:
      - sections/section-000/module-01/course-01-policy-objects-and-rule-anatomy.md
      - sections/section-000/module-01/course-02-failure-actions-and-rollout.md
      - sections/section-000/module-01/course-03-rule-ordering-and-exceptions.md
    prompt: "A validating policy named `aa-validate` requires a team label. A mutating policy named `zz-mutate` adds the label by default. A Pod without the label is submitted. What happens?"
    options:
      - id: a
        text: "It is rejected, because `aa-validate` sorts first by name."
        explanation: "Policy names do not decide order."
      - id: b
        text: "It is rejected, because validate always runs first."
        explanation: "Mutate runs first."
      - id: c
        text: "It is admitted, because all mutate rules finish before any validate rule runs, regardless of policy name."
        explanation: "Ordering is by rule type: mutate, then validate, then generate asynchronously."
      - id: d
        text: "It is admitted only if the policies share one file."
        explanation: "File layout does not matter."
    correct_option: c
    explanation: "Ordering is by rule type: mutate, then validate, then generate asynchronously."

  - id: ats011-final-q46
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose among exclude, preconditions and PolicyException"
    source_readings:
      - sections/section-000/module-01/course-01-policy-objects-and-rule-anatomy.md
      - sections/section-000/module-01/course-02-failure-actions-and-rollout.md
      - sections/section-000/module-01/course-03-rule-ordering-and-exceptions.md
      - sections/section-020/module-01/course-01-preconditions-and-operators.md
      - sections/section-020/module-01/course-02-preconditions-vs-match.md
    prompt: "An application team needs a reviewed exemption for one workload without anyone editing a cluster-wide policy. Which mechanism fits?"
    options:
      - id: a
        text: "A PolicyException object granted to that workload."
        explanation: "`exclude` is a permanent carve-out written by the policy author and `preconditions` gate on resource data; neither lets a team request an exemption through review."
      - id: b
        text: "`exclude` inside the policy rule, edited by the platform team."
        explanation: "That requires editing the policy."
      - id: c
        text: "`preconditions` on a label the team sets."
        explanation: "That lets anyone self-exempt by label and changes the policy."
      - id: d
        text: "Switching the policy to Audit."
        explanation: "That loosens it for everyone."
    correct_option: a
    explanation: "`exclude` is a permanent carve-out written by the policy author and `preconditions` gate on resource data; neither lets a team request an exemption through review."

  - id: ats011-final-q47
    type: single_choice
    difficulty: intermediate
    learning_objective: "Check every list element in an assertion tree"
    source_readings:
      - sections/section-010/module-05/course-01-assertion-trees.md
      - sections/section-010/module-05/course-03-summary.md
    prompt: "A `validate.assert` tree must reject a Pod if any container image ends in `:latest`. How is each container checked?"
    options:
      - id: a
        text: "Write `containers` as a plain key and test `(ends_with(image, ':latest')): false` beneath it."
        explanation: "A plain key hands the whole list to the next node, not each element."
      - id: b
        text: "Use `->containers` so each container is bound to a variable."
        explanation: "`->name` stores a computed result; it does not iterate."
      - id: c
        text: "Use `oldObject` and compare the images before and after."
        explanation: "`oldObject` is the pre-update resource and does not iterate containers."
      - id: d
        text: "Prefix the list key with the `~.` modifier and test `(ends_with(image, ':latest')): false` on each element."
        explanation: "Without `~.` the next node receives the whole list rather than one container. Parenthesised keys are JMESPath expressions compared with the leaf value."
    correct_option: d
    explanation: "Without `~.` the next node receives the whole list rather than one container. Parenthesised keys are JMESPath expressions compared with the leaf value."

  - id: ats011-final-q48
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain ignoreFields in validate.manifests"
    source_readings:
      - sections/section-010/module-05/course-02-validating-signed-manifests.md
      - sections/section-010/module-05/course-03-summary.md
    prompt: "A signed Deployment manifest is rejected after a HorizontalPodAutoscaler changes `spec.replicas`. How does `validate.manifests` handle this legitimately?"
    options:
      - id: a
        text: "Remove the signature requirement from the policy for Deployments."
        explanation: "That removes the protection entirely."
      - id: b
        text: "List `spec.replicas` under `ignoreFields` for kind Deployment, keeping the list as short as possible."
        explanation: "Controllers and the API server change fields after signing; every ignored field is one an attacker can also change without breaking the signature."
      - id: c
        text: "Set `count: 0` on the attestor so any change is accepted."
        explanation: "`count` is the number of signers required, not a tolerance."
      - id: d
        text: "Sign the manifest again from inside the cluster after each change."
        explanation: "Signing happens outside the cluster in the delivery pipeline."
    correct_option: b
    explanation: "Controllers and the API server change fields after signing; every ignored field is one an attacker can also change without breaking the signature."

  - id: ats011-final-q49
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the anchor for a default value"
    source_readings:
      - sections/section-040/module-03/course-01-add-if-not-present-anchor.md
      - sections/section-040/module-03/course-02-conditional-anchors-in-mutation.md
    prompt: "A mutate rule must add `team: platform` only when a Pod has no `team` label, without overwriting `team: payments`. Which fragment does that?"
    options:
      - id: a
        text: "`labels: {+(team): platform}`, the add-if-not-present anchor around the key."
        explanation: "A plain `team: platform` overwrites the owner's value. A conditional anchor `(team)` is an if that selects, not a default writer."
      - id: b
        text: "`labels: {team: platform}`"
        explanation: "A plain value overwrites whatever the owner set."
      - id: c
        text: "`labels: {(team): platform}`"
        explanation: "A conditional anchor only selects elements where the value matches; it does not add a missing key."
      - id: d
        text: "`labels: {=(team): platform}`"
        explanation: "That is not the add-if-not-present anchor; `+()` is."
    correct_option: a
    explanation: "A plain `team: platform` overwrites the owner's value. A conditional anchor `(team)` is an if that selects, not a default writer."

  - id: ats011-final-q50
    type: single_choice
    difficulty: intermediate
    learning_objective: "Select a subset of containers in a mutation"
    source_readings:
      - sections/section-040/module-03/course-02-conditional-anchors-in-mutation.md
      - sections/section-040/module-03/course-03-summary.md
    prompt: "A mutate rule has `containers: [{(name): \"sidecar-*\", securityContext: {readOnlyRootFilesystem: true}}]`. A Pod has containers `app` and `sidecar-log`. What is patched?"
    options:
      - id: a
        text: "Both containers, because wildcards in anchors are ignored."
        explanation: "Wildcards narrow the selection."
      - id: b
        text: "Only `app`, because the anchor excludes matching names."
        explanation: "The anchor selects matches rather than excluding them."
      - id: c
        text: "Only `sidecar-log`, because the anchor is evaluated first and the plain fields apply only where it matches."
        explanation: "`(name): \"*\"` is the widest form of the same filter; wildcards `*` and `?` select subsets."
      - id: d
        text: "Neither, because conditional anchors work only in validate rules."
        explanation: "They are supported in patchStrategicMerge."
    correct_option: c
    explanation: "`(name): \"*\"` is the widest form of the same filter; wildcards `*` and `?` select subsets."

  - id: ats011-final-q51
    type: single_choice
    difficulty: advanced
    learning_objective: "Use time and number functions correctly"
    source_readings:
      - sections/section-070/module-03/course-01-string-and-number-functions.md
      - sections/section-070/module-03/course-02-collections-time-and-encoding-functions.md
    prompt: "A rule denies a resource whose `approved` annotation is more than 24 hours old. Which expression and operator are right?"
    options:
      - id: a
        text: "`time_since(...)` with the numeric `GreaterThan` operator and value `24`."
        explanation: "A duration string is not a number; use the duration operators."
      - id: b
        text: "`time_since('', annotation || '', '')` with the `DurationGreaterThan` operator and value `24h`."
        explanation: "time_since returns a duration string such as `48h0m33s`, which needs the duration operators; annotation values are strings, so numeric functions need `to_number()` first."
      - id: c
        text: "`time_now()` with `Equals` and the annotation value."
        explanation: "That compares equality and gives no elapsed time."
      - id: d
        text: "`items(annotations, 'key', 'value')` with `DurationGreaterThan`."
        explanation: "`items` reshapes a map and measures no time."
    correct_option: b
    explanation: "time_since returns a duration string such as `48h0m33s`, which needs the duration operators; annotation values are strings, so numeric functions need `to_number()` first."
